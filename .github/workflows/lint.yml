name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and linters
        run: |
          pip install --upgrade pip
          pip install ansible-core yamllint ansible-lint

      - name: Lint YAML
        run: yamllint ./

      - name: Lint Ansible
        run: ansible-lint
