---
# Host-level overrides for Ubuntu targets.
# Role-specific values (package lists, repo URLs, dotfiles, etc.) are owned by
# each role's own `role/vars/main.yml`. Only override them here if you need to
# customize a specific play run via inventory-level precedence.

# The account Ansible manages and that becomes the docker/uv/vagrant user.
ansible_user: zulu

# Home directory of the managed user (single source of truth for user paths).
# Required: pipx/dotfiles/fonts/gnome/vagrant roles derive their user paths
# from this value.
user_home: /home/{{ ansible_user }}

# Root of the persistent data partition (used for docker, vagrant, libvirt).
# Required: docker/vagrant roles derive their data dirs from this value.
storage_root: /storage
