---
# Force system Python so apt-installed libvirt/lxml bindings are visible.
ansible_python_interpreter: /usr/bin/python3

# HashiCorp / Vagrant

vagrant_prerequisites:
  - ca-certificates
  - curl
  - gnupg
  # apt_repository module requirement — needed before the HashiCorp repo
  # can be added. Without it, --tags vagrant fails on a fresh host.
  - software-properties-common

vagrant_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

vagrant_apt_arch: >-
  {{
    vagrant_apt_arch_map[ansible_facts['architecture']]
    | default('')
  }}

# libvirt boots the guest with the host CPU's emulator, so an aarch64 host
# needs qemu-system-arm — qemu-system-x86 would be the wrong emulator there.
vagrant_qemu_package_map:
  x86_64: qemu-system-x86
  aarch64: qemu-system-arm

vagrant_qemu_package: >-
  {{
    vagrant_qemu_package_map[ansible_facts['architecture']]
    | default('')
  }}

vagrant_apt_key_url: https://apt.releases.hashicorp.com/gpg

vagrant_gpg_key_path: /etc/apt/keyrings/hashicorp.asc

vagrant_apt_repo_url: https://apt.releases.hashicorp.com

vagrant_apt_repo: >-
  deb [arch={{ vagrant_apt_arch }}
  signed-by={{ vagrant_gpg_key_path }}]
  {{ vagrant_apt_repo_url }}
  {{ ansible_facts['distribution_release'] }} main

vagrant_packages:
  - vagrant

# KVM / Libvirt

vagrant_libvirt_packages:
  - bridge-utils
  - genisoimage
  - libguestfs-tools
  - libvirt-clients
  - libvirt-daemon-system
  - python3-libvirt
  - python3-lxml
  - "{{ vagrant_qemu_package }}"
  - qemu-utils
  - virt-manager

# Vagrant configuration

vagrant_plugin_libvirt: vagrant-libvirt

vagrant_home: "{{ storage_root }}/vagrant"

storage_libvirt_images: "{{ storage_root }}/libvirt/images"

# Environment used when Vagrant is executed as the normal desktop user.

vagrant_user_env:
  VAGRANT_HOME: "{{ vagrant_home }}"
  HOME: "{{ user_home }}"
  PATH: >-
    {{ user_home }}/.local/bin:
    /snap/bin:
    /usr/local/bin:
    /usr/bin:
    /bin

  http_proxy: "{{ lookup('ansible.builtin.env', 'http_proxy') | default(omit, true) }}"
  https_proxy: "{{ lookup('ansible.builtin.env', 'https_proxy') | default(omit, true) }}"
