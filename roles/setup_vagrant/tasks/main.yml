---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Install vagrant prerequisites
  ansible.builtin.apt:
    name: "{{ vagrant_prerequisites }}"
    state: present

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG key for hashicorp
  ansible.builtin.get_url:
    url: "{{ vagrant_apt_key_url }}"
    dest: "{{ vagrant_gpg_key_path }}"
    mode: "0644"

# Older role versions de-armored the key to hashicorp.gpg; remove the stale
# file now that the repository uses the armored .asc directly.
- name: Remove stale de-armored hashicorp key
  ansible.builtin.file:
    path: /etc/apt/keyrings/hashicorp.gpg
    state: absent

- name: Add repository for hashicorp
  ansible.builtin.apt_repository:
    filename: hashicorp
    repo: "{{ vagrant_apt_repo }}"
    state: present
  notify: Update apt cache

- name: Install Vagrant
  ansible.builtin.apt:
    name: "{{ vagrant_packages }}"
    state: present
    update_cache: true

- name: Install libvirt and KVM packages
  ansible.builtin.apt:
    name: "{{ vagrant_libvirt_packages }}"
    state: present
  notify: Start libvirtd

- name: Add current user to kvm and libvirt groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: kvm,libvirt
    append: true
  when: ansible_user != 'root'

- name: Create Vagrant home directory on /storage
  ansible.builtin.file:
    path: "{{ vagrant_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if vagrant-libvirt plugin is installed
  ansible.builtin.shell: |
    set -o pipefail
    VAGRANT_HOME="{{ vagrant_home }}" vagrant plugin list | grep -q "{{ vagrant_plugin_libvirt }}"
  register: vagrant_libvirt_check
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ vagrant_user_env }}"

- name: Install vagrant-libvirt plugin  # noqa: command-instead-of-shell no-changed-when
  ansible.builtin.shell: VAGRANT_HOME="{{ vagrant_home }}" vagrant plugin install "{{ vagrant_plugin_libvirt }}"
  when: vagrant_libvirt_check.rc != 0
  environment: "{{ vagrant_user_env }}"
  async: 600
  poll: 5
  become: false

- name: Ensure libvirt images directory on /storage exists
  ansible.builtin.file:
    path: "{{ storage_libvirt_images }}"
    state: directory
    owner: libvirt-qemu
    group: kvm
    mode: "0755"
  when: storage_libvirt_images is defined
  notify: Start libvirtd

- name: Check default libvirt pool path
  ansible.builtin.shell: |
    set -o pipefail
    virsh pool-dumpxml default 2>/dev/null | grep -oP '(?<=<path>)[^<]+'
  register: libvirt_default_pool_path
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reconfigure default libvirt pool to /storage
  ansible.builtin.shell: |
    set -e
    virsh pool-destroy default 2>/dev/null || true
    virsh pool-undefine default 2>/dev/null || true
    virsh pool-define-as default dir - - - - "{{ storage_libvirt_images }}"
    virsh pool-build default
    virsh pool-start default
    virsh pool-autostart default
  when:
    - storage_libvirt_images is defined
    - libvirt_default_pool_path.stdout is defined
    - libvirt_default_pool_path.stdout != storage_libvirt_images
  register: libvirt_pool_reconfigure
  changed_when: libvirt_pool_reconfigure is succeeded
  failed_when: libvirt_pool_reconfigure is failed
