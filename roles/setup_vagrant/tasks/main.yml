---
# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------

- name: Validate supported architecture
  ansible.builtin.assert:
    that:
      - vagrant_apt_arch | length > 0
      - vagrant_qemu_package | length > 0
    fail_msg: >-
      Unsupported architecture '{{ ansible_facts["architecture"] }}'.
      Supported architectures are x86_64 and aarch64.
    quiet: true

# ---------------------------------------------------------------------------
# APT
# ---------------------------------------------------------------------------

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install Vagrant prerequisites
  ansible.builtin.apt:
    name: "{{ vagrant_prerequisites }}"
    state: present

# ---------------------------------------------------------------------------
# HashiCorp repository
# ---------------------------------------------------------------------------

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download HashiCorp repository GPG key
  ansible.builtin.get_url:
    url: "{{ vagrant_apt_key_url }}"
    dest: "{{ vagrant_gpg_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure HashiCorp APT repository
  ansible.builtin.apt_repository:
    filename: hashicorp
    repo: "{{ vagrant_apt_repo }}"
    state: present
    update_cache: true

# ---------------------------------------------------------------------------
# Vagrant
# ---------------------------------------------------------------------------

- name: Install Vagrant
  ansible.builtin.apt:
    name: "{{ vagrant_packages }}"
    state: present

# ---------------------------------------------------------------------------
# KVM / Libvirt
# ---------------------------------------------------------------------------

- name: Install Libvirt and KVM packages
  ansible.builtin.apt:
    name: "{{ vagrant_libvirt_packages }}"
    state: present
  notify: Start libvirtd

- name: Add current user to KVM and Libvirt groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - kvm
      - libvirt
    append: true
  when: ansible_user != 'root'

# ---------------------------------------------------------------------------
# Vagrant home
# ---------------------------------------------------------------------------

# Same 0755 root:root storage root as in setup_docker, so this role also works
# when run alone via --tags vagrant and libvirt image paths stay traversable.
- name: Ensure storage root directory exists
  ansible.builtin.file:
    path: "{{ storage_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Vagrant home directory
  ansible.builtin.file:
    path: "{{ vagrant_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ---------------------------------------------------------------------------
# Vagrant libvirt plugin
# ---------------------------------------------------------------------------

- name: Check installed Vagrant plugins
  ansible.builtin.command:
    cmd: vagrant plugin list --machine-readable
  register: vagrant_plugins
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ vagrant_user_env }}"

- name: Install vagrant-libvirt plugin
  ansible.builtin.command:
    cmd: vagrant plugin install "{{ vagrant_plugin_libvirt }}"
  when:
    - vagrant_plugins.rc == 0
    - vagrant_plugin_libvirt not in vagrant_plugins.stdout
  become: false
  changed_when: true
  environment: "{{ vagrant_user_env }}"
  async: 600
  poll: 5

# ---------------------------------------------------------------------------
# Libvirt storage
# ---------------------------------------------------------------------------

# The 'Start libvirtd' handler only flushes at the end of the play — after
# the pool tasks below, which need a live daemon connection. Start libvirtd
# explicitly here (idempotent) instead of relying on handler order; this also
# covers re-runs where packages/dirs are unchanged but the daemon was stopped.
- name: Ensure libvirtd is running
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Ensure Libvirt images directory exists
  ansible.builtin.file:
    path: "{{ storage_libvirt_images }}"
    state: directory
    owner: libvirt-qemu
    group: kvm
    mode: "0755"
  notify: Start libvirtd

- name: Ensure default Libvirt storage pool exists
  community.libvirt.virt_pool:
    name: default
    state: present
    xml: |
      <pool type='dir'>
        <name>default</name>
        <target>
          <path>{{ storage_libvirt_images }}</path>
        </target>
      </pool>

- name: Ensure default Libvirt storage pool is active
  community.libvirt.virt_pool:
    name: default
    state: active

- name: Ensure default Libvirt storage pool autostarts
  community.libvirt.virt_pool:
    name: default
    autostart: true
