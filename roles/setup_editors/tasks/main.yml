---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG key for vscode
  ansible.builtin.get_url:
    url: "{{ vscode_apt_key_url }}"
    dest: /etc/apt/keyrings/packages.microsoft.asc
    mode: "0644"
  register: apt_key_download

- name: De-armor GPG key for vscode
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.asc"
    creates: /etc/apt/keyrings/packages.microsoft.gpg
  when: apt_key_download.changed or ansible_check_mode
  changed_when: false

- name: Add repository for vscode
  ansible.builtin.apt_repository:
    filename: vscode
    repo: "{{ vscode_apt_repo }}"
    state: present
  notify: Update apt cache

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true

- name: Install editor snap packages
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ editor_snap_packages }}"
  become: true
