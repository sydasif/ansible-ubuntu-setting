---
- name: Set up VS Code APT repository
  ansible.builtin.include_tasks:
    file: ../../common/tasks/apt_keyring.yml
  vars:
    apt_keyring_name: "vscode"
    apt_keyring_url: "{{ vscode_apt_key_url }}"
    apt_keyring_repo: "{{ vscode_apt_repo }}"
    apt_keyring_key_dest: "/etc/apt/keyrings/packages.microsoft.asc"
    apt_keyring_gpg_dest: "/etc/apt/keyrings/packages.microsoft.gpg"
    apt_repository_filename: "vscode"

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true

- name: Install editor snap packages
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ editor_snap_packages }}"
  become: true
