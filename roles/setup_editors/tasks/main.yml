---
- name: Install vscode dependencies
  ansible.builtin.apt:
    name: "{{ vscode_dependencies }}"
    state: present
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG key for vscode
  ansible.builtin.get_url:
    url: "{{ vscode_apt_key_url }}"
    dest: "{{ vscode_gpg_key_path }}"
    mode: "0644"

# Older role versions de-armored the key to packages.microsoft.gpg; remove the
# stale file now that the repository uses the armored .asc directly.
- name: Remove stale de-armored vscode key
  ansible.builtin.file:
    path: /etc/apt/keyrings/packages.microsoft.gpg
    state: absent

- name: Add repository for vscode
  ansible.builtin.apt_repository:
    filename: vscode
    repo: "{{ vscode_apt_repo }}"
    state: present
  notify: Update apt cache

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true

- name: Install editor snap packages
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default(false) }}"
    state: present
  loop: "{{ editor_snap_packages }}"
