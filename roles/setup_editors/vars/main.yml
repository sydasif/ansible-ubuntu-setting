---
# VS Code APT repository
vscode_apt_key_url: https://packages.microsoft.com/keys/microsoft.asc
vscode_apt_repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main

# Editor snap packages
editor_snap_packages:
  - name: nvim
    classic: true
