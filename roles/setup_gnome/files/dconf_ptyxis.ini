[org/gnome/Ptyxis]
audible-bell=true
cursor-blink-mode='on'
cursor-shape='underline'
default-profile-uuid='01d5cad4ed3c2c9a45963d4d6a6fbb3a'
font-name='JetBrainsMono Nerd Font Light Italic 11'
interface-style='dark'
profile-uuids=['01d5cad4ed3c2c9a45963d4d6a6fbb3a']
text-blink-mode='focused'
use-system-font=false
window-size=(uint32 176, uint32 38)

[org/gnome/Ptyxis/Profiles/01d5cad4ed3c2c9a45963d4d6a6fbb3a]
bold-is-bright=true
cell-height-scale=1.0
cell-width-scale=1.0
label='main'
opacity=1.0
palette='Vs Code'

[org/gnome/desktop/default-applications/terminal]
exec='ptyxis'
exec-arg=''

# Ptyxis dock-favorite and notification entries, moved out of the ungated
# 00-gnome-defaults keyfile. Within one dconf db the later-sorting keyfile
# wins, so on Ptyxis machines these lists override the Ptyxis-less lists from
# 00-gnome-defaults, while non-Ptyxis machines never see them.
[org/gnome/desktop/notifications]
application-children=['org-gnome-ptyxis', 'firefox-firefox', 'gnome-power-panel', 'update-manager', 'code', 'snapd-desktop-integration-snapd-desktop-integration']

[org/gnome/desktop/notifications/application/org-gnome-ptyxis]
application-id='org.gnome.Ptyxis.desktop'

[org/gnome/shell]
favorite-apps=['firefox_firefox.desktop', 'org.gnome.Nautilus.desktop', 'code.desktop', 'org.gnome.Ptyxis.desktop']
