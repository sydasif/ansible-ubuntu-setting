---
- name: Copy GNOME wallpaper
  ansible.builtin.copy:
    src: "default_wallpaper.jpg"
    dest: "/usr/share/backgrounds/default_wallpaper.jpg"
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Ensure dconf directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/local.d
    - /etc/dconf/db/gdm.d

- name: Deploy GNOME dconf defaults
  ansible.builtin.copy:
    src: dconf_gnome.ini
    dest: /etc/dconf/db/local.d/00-gnome-defaults
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf
  become: true

- name: Deploy GDM dconf settings defaults
  ansible.builtin.copy:
    src: dconf_gdm.ini
    dest: /etc/dconf/db/gdm.d/00-global
    mode: "0644"
    owner: root
    group: root
  notify: Update dconf
  become: true

- name: Copy dconf user profile
  ansible.builtin.copy:
    src: profile
    dest: /etc/dconf/profile/user
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Get current default terminal exec
  ansible.builtin.command: gsettings get org.gnome.desktop.default-applications.terminal exec
  become: false
  changed_when: false
  failed_when: false
  register: terminal_exec_current

- name: Get current default terminal exec-arg
  ansible.builtin.command: gsettings get org.gnome.desktop.default-applications.terminal exec-arg
  become: false
  changed_when: false
  failed_when: false
  register: terminal_exec_arg_current

- name: Set default terminal exec
  ansible.builtin.command: gsettings set org.gnome.desktop.default-applications.terminal exec ptyxis
  become: false
  changed_when: true
  when:
    - terminal_exec_current.rc == 0
    - terminal_exec_current.stdout != "'ptyxis'"

- name: Set default terminal exec-arg
  ansible.builtin.command: gsettings set org.gnome.desktop.default-applications.terminal exec-arg ''
  become: false
  changed_when: true
  when:
    - terminal_exec_arg_current.rc == 0
    - terminal_exec_arg_current.stdout != "''"

- name: Get current xdg default terminal
  ansible.builtin.command: xdg-settings get default-terminal
  become: false
  changed_when: false
  failed_when: false
  register: xdg_terminal_current

- name: Set xdg default terminal
  ansible.builtin.command: xdg-settings set default-terminal org.gnome.Ptyxis.desktop
  become: false
  changed_when: true
  when:
    - xdg_terminal_current.rc == 0
    - xdg_terminal_current.stdout != 'org.gnome.Ptyxis.desktop'

- name: Register ptyxis as new-window terminal for xdg
  ansible.builtin.copy:
    content: "org.gnome.Ptyxis.desktop:new-window\n"
    dest: "{{ user_home }}/.config/ubuntu-xdg-terminals.list"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: false
