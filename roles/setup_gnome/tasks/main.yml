---
- name: Copy GNOME wallpaper
  ansible.builtin.copy:
    src: "default_wallpaper.jpg"
    dest: "/usr/share/backgrounds/default_wallpaper.jpg"
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Ensure dconf directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/local.d
    - /etc/dconf/db/gdm.d

# Ptyxis is the default terminal only on Ubuntu 25.04+/26.04; 22.04/24.04
# ship gnome-terminal (default exec: x-terminal-emulator). Every
# Ptyxis-specific config below is gated on the binary actually existing.
- name: Check whether Ptyxis is installed
  ansible.builtin.stat:
    path: /usr/bin/ptyxis
  register: ptyxis_binary
  become: false

- name: Deploy GNOME dconf defaults
  ansible.builtin.copy:
    src: dconf_gnome.ini
    dest: /etc/dconf/db/local.d/00-gnome-defaults
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf
  become: true

# Ptyxis dconf defaults live in a separate keyfile so machines without
# Ptyxis (22.04/24.04) never get a default terminal pointing at a missing
# binary from the system database.
- name: Deploy Ptyxis dconf defaults
  ansible.builtin.copy:
    src: dconf_ptyxis.ini
    dest: /etc/dconf/db/local.d/10-ptyxis
    owner: root
    group: root
    mode: "0644"
  when: ptyxis_binary.stat.exists
  notify: Update dconf
  become: true

- name: Remove Ptyxis dconf defaults when Ptyxis is absent
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/10-ptyxis
    state: absent
  when: not ptyxis_binary.stat.exists
  notify: Update dconf
  become: true

# Nord gnome-terminal profile with the JetBrainsMono Nerd Font Mono (restored
# from the repo's old dconf_terminal.ini). The profile's keys are prefixed
# with a high number so they layer after the Ptyxis defaults.
- name: Deploy terminal profile dconf defaults
  ansible.builtin.copy:
    src: dconf_terminal.ini
    dest: /etc/dconf/db/local.d/20-terminal
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf
  become: true

# The pre-gate playbook additionally wrote Ptyxis into the *user* dconf db
# and the xdg terminal list even on machines without Ptyxis. Undo exactly
# those writes (fingerprint: the value is still the one the old playbook
# set) so a stale override does not survive; anything the user configured
# themselves is left alone. These only fire on non-Ptyxis systems.
- name: Get user default terminal exec
  community.general.dconf:
    key: /org/gnome/desktop/default-applications/terminal/exec
    state: read
  become: false
  register: stale_terminal_exec

- name: Get user default terminal exec-arg
  community.general.dconf:
    key: /org/gnome/desktop/default-applications/terminal/exec-arg
    state: read
  become: false
  register: stale_terminal_exec_arg

- name: Reset stale Ptyxis default-terminal exec when Ptyxis is absent
  community.general.dconf:
    key: /org/gnome/desktop/default-applications/terminal/exec
    state: absent
  become: false
  when:
    - not ptyxis_binary.stat.exists
    - stale_terminal_exec.value == "'ptyxis'"

- name: Reset stale Ptyxis default-terminal exec-arg when Ptyxis is absent
  community.general.dconf:
    key: /org/gnome/desktop/default-applications/terminal/exec-arg
    state: absent
  become: false
  when:
    - not ptyxis_binary.stat.exists
    - stale_terminal_exec.value == "'ptyxis'"
    - stale_terminal_exec_arg.value == "''"

- name: Deploy GDM dconf settings defaults
  ansible.builtin.copy:
    src: dconf_gdm.ini
    dest: /etc/dconf/db/gdm.d/00-global
    mode: "0644"
    owner: root
    group: root
  notify: Update dconf
  become: true

- name: Copy dconf user profile
  ansible.builtin.copy:
    src: profile
    dest: /etc/dconf/profile/user
    mode: "0644"
    owner: root
    group: root
  become: true

# Ptyxis-only: point the default-terminal settings at Ptyxis. On 22.04/24.04
# the block is skipped, leaving the working x-terminal-emulator default alone.
- name: Configure Ptyxis as the default terminal
  when: ptyxis_binary.stat.exists
  block:
    - name: Set default terminal exec via dconf
      community.general.dconf:
        key: /org/gnome/desktop/default-applications/terminal/exec
        value: "'ptyxis'"
        state: present
      become: false

    - name: Set default terminal exec-arg via dconf
      community.general.dconf:
        key: /org/gnome/desktop/default-applications/terminal/exec-arg
        value: "''"
        state: present
      become: false

    - name: Get current xdg default terminal
      ansible.builtin.command: xdg-settings get default-terminal
      become: false
      changed_when: false
      failed_when: false
      register: xdg_terminal_current

    - name: Set xdg default terminal
      ansible.builtin.command: xdg-settings set default-terminal org.gnome.Ptyxis.desktop
      become: false
      changed_when: true
      when:
        - xdg_terminal_current.rc == 0
        - xdg_terminal_current.stdout != 'org.gnome.Ptyxis.desktop'

    - name: Register ptyxis as new-window terminal for xdg
      ansible.builtin.copy:
        content: "org.gnome.Ptyxis.desktop:new-window\n"
        dest: "{{ user_home }}/.config/ubuntu-xdg-terminals.list"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: false
