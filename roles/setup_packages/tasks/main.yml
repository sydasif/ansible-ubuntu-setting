---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: yes

- name: Check if uv is installed
  ansible.builtin.command: uv --version
  register: uv_check
  changed_when: false
  failed_when: false

- name: Install uv
  ansible.builtin.shell: >
    curl -LsSf {{ uv_install_script }} | sh
  when: uv_check.rc != 0
  args:
    executable: /bin/bash
  become: false
  vars:
    ansible_become: false
    ansible_user: "{{ lookup('env', 'USER') }}"

- name: Install Python development packages
  ansible.builtin.apt:
    name: "{{ python_packages }}"
    state: present

- name: Install virtualization packages
  ansible.builtin.apt:
    name: "{{ virtualization_packages }}"
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'
