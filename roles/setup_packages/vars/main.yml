---
# CLI / shell utilities
cli_packages:
  - bat
  - zsh
  - tree
  - curl
  - lsd
  - fzf
  - starship
  - git
  - sshpass
  - openvswitch-switch

# Desktop packages
desktop_packages:
  - gnome-tweaks
uv_install_script: https://astral.sh/uv/install.sh
# Python development
python_packages:
  - python3-pip
  - python3-venv
  - python3-psutil
  - pipx
# Virtualization packages
virtualization_packages:
  - bridge-utils
  - cloud-utils
  - genisoimage
  - libguestfs-tools
  - libvirt-dev
  - qemu-utils
  - virt-manager

# Environment for uv/snap commands (runs as non-root user)
packages_user_env:
  PATH: "/home/{{ ansible_user }}/.local/bin:/snap/bin:/usr/local/bin:/usr/bin:/bin"
  HOME: "/home/{{ ansible_user }}"
