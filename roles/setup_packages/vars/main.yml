---
# Base system utilities
base_packages:
  - bat
  - zsh
  - tree
  - curl
  - lsd
  - fzf
  - starship
  - gnome-tweaks
  - git
uv_install_script: https://astral.sh/uv/install.sh
vscode_apt_key_url: https://packages.microsoft.com/keys/microsoft.asc
vscode_apt_repo: deb [arch=amd64] https://packages.microsoft.com/repos/code stable main
ghostty_ppa: ghostty-ubuntu/ppa
# Python development
python_packages:
  - python3-pip
  - python3-venv
  - python3-psutil
# Virtualization packages
virtualization_packages:
  - bridge-utils
  - cloud-utils
  - genisoimage
  - libguestfs-tools
  - libvirt-dev
  - qemu-utils
  - virt-manager
