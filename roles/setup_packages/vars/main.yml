---
# CLI / shell utilities
cli_packages:
  - bat
  - zsh
  - tree
  - curl
  - lsd
  - fzf
  - starship
  - git
  - sshpass
  - openvswitch-switch

# Desktop packages
desktop_packages:
  - gnome-tweaks

# Python development
python_packages:
  - python3-pip
  - python3-venv
  - python3-psutil
  - pipx

# Virtualization packages
virtualization_packages:
  - bridge-utils
  - cloud-utils
  - genisoimage
  - libguestfs-tools
  - libvirt-dev
  - qemu-utils
  - virt-manager

# Snap packages
snap_packages:
  - name: astral-uv
    classic: true
  - name: ruff
    classic: false
  - name: nvim
    classic: true
