---
fonts_base_dir: "{{ user_home }}/.fonts"

# System fonts requested by other config in this repo: Inter is the GNOME
# document-font (dconf), JetBrains Mono the GNOME monospace font (dconf) and
# the VS Code editor.fontFamily (dotfiles). The Nerd Font below additionally
# provides the glyphs starship/terminal UIs need. Adwaita Sans is NOT
# packaged for noble, so dconf deliberately does not request it.
font_packages:
  - fonts-inter
  - fonts-jetbrains-mono

jetbrains_mono_font_name: "JetBrainsMonoNerdFont-Regular.ttf"
jetbrains_mono_download_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.tar.xz"
# SHA-256 of JetBrainsMono.tar.xz (nerd-fonts v3.4.0), taken from the release's
# SHA-256.txt. The download task prefixes this with `sha256:`.
jetbrains_mono_checksum: "ef552a3e638f25125c6ad4c51176a6adcdce295ab1d2ffacf0db060caf8c1582"
