---
- name: Install system fonts
  ansible.builtin.apt:
    name: "{{ font_packages }}"
    state: present

- name: Ensure fonts directory
  ansible.builtin.file:
    path: "{{ fonts_base_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: "0755"

- name: Check if JetBrainsMono is installed
  ansible.builtin.stat:
    path: "{{ fonts_base_dir }}/{{ jetbrains_mono_font_name }}"
  register: jetbrains_mono_stat

- name: Install the JetBrainsMono Nerd Font
  when: not jetbrains_mono_stat.stat.exists
  block:
    - name: Download JetBrainsMono tarball
      ansible.builtin.get_url:
        url: "{{ jetbrains_mono_download_url }}"
        dest: "/tmp/JetBrainsMono.tar.xz"
        checksum: "sha256:{{ jetbrains_mono_checksum }}"
        mode: "0644"

    - name: Extract JetBrainsMono
      ansible.builtin.unarchive:
        src: "/tmp/JetBrainsMono.tar.xz"
        dest: "{{ fonts_base_dir }}/"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      notify: Refresh font cache

    # Gate on font absence so a re-run never re-downloads.
    - name: Remove JetBrainsMono tarball
      ansible.builtin.file:
        path: "/tmp/JetBrainsMono.tar.xz"
        state: absent
