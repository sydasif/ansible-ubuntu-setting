---
# Pin to the latest release at time of writing; bump when upgrading.
containerlab_version: "0.79.0"
# GitHub releases serve stable assets; Fury APT is flaky (intermittent 404s).
containerlab_arch_map:
  x86_64: amd64
  aarch64: arm64
containerlab_github_url: "https://github.com/srl-labs/containerlab/releases/download/v{{ containerlab_version }}/containerlab_{{ containerlab_version }}_linux_{{ containerlab_arch_map[ansible_facts['architecture']] }}.deb"
