---
# Fail loud: containerlab publishes amd64/arm64 assets only, so a bare map
# lookup would otherwise die with a cryptic "dict object has no attribute".
- name: Validate supported architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in containerlab_arch_map
    fail_msg: >-
      Unsupported architecture '{{ ansible_facts["architecture"] }}'.
      containerlab publishes amd64 (x86_64) and arm64 (aarch64) assets only.
    quiet: true

# The download only happens when the pinned version is not installed, which
# keeps re-runs offline and makes the /tmp cleanup below safe. The binary check
# covers a package that is registered but broken or partly removed: dpkg would
# still report the pinned version, so the version test alone would skip repair.
- name: Check installed containerlab version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' containerlab"
  register: _clab_installed
  changed_when: false
  failed_when: false

- name: Check whether the containerlab binary exists
  ansible.builtin.stat:
    path: /usr/bin/containerlab
  register: _clab_binary

- name: Install containerlab from GitHub releases
  when: >-
    containerlab_version not in (_clab_installed.stdout | default('')) or
    not _clab_binary.stat.exists
  block:
    - name: Download containerlab .deb from GitHub releases
      ansible.builtin.get_url:
        url: "{{ containerlab_github_url }}"
        dest: "/tmp/containerlab.deb"
        mode: "0644"
      register: _clab_download
      until: _clab_download is succeeded
      retries: 3
      delay: 5

    - name: Download checksums file
      ansible.builtin.get_url:
        url: "{{ containerlab_release_url }}/checksums.txt"
        dest: "/tmp/containerlab_checksums.txt"
        mode: "0644"

    - name: Read checksums file
      ansible.builtin.command: cat /tmp/containerlab_checksums.txt
      register: _clab_checksums_content
      changed_when: false

    - name: Extract expected SHA256
      ansible.builtin.set_fact:
        _clab_expected_hash: >-
          {{
            _clab_checksums_content.stdout |
            regex_search(
              '([a-f0-9]{64})\s+containerlab_' ~ containerlab_version ~
              '_linux_' ~ containerlab_asset_arch ~
              '\.deb', '\1'
            ) |
            first
          }}

    - name: Compute actual SHA256 of downloaded deb
      ansible.builtin.command: sha256sum /tmp/containerlab.deb
      register: _clab_actual
      changed_when: false

    - name: Verify SHA256 checksum matches
      ansible.builtin.assert:
        that: _clab_expected_hash == _clab_actual.stdout.split()[0]
        fail_msg: "SHA256 mismatch for containerlab {{ containerlab_version }}"

    - name: Install containerlab .deb
      ansible.builtin.apt:
        deb: /tmp/containerlab.deb
        state: present
      register: _clab_install
      until: _clab_install is succeeded
      retries: 3
      delay: 5

    - name: Remove containerlab install artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/containerlab.deb
        - /tmp/containerlab_checksums.txt

- name: Verify containerlab installation
  ansible.builtin.command: containerlab version
  register: _clab_version
  changed_when: false
  failed_when: false
