---
- name: Download containerlab .deb from GitHub releases
  ansible.builtin.get_url:
    url: "{{ containerlab_github_url }}"
    dest: "/tmp/containerlab.deb"
    mode: "0644"
  register: _clab_download
  until: _clab_download is succeeded
  retries: 3
  delay: 5

- name: Download checksums file
  ansible.builtin.get_url:
    url: "https://github.com/srl-labs/containerlab/releases/download/v{{ containerlab_version }}/checksums.txt"
    dest: "/tmp/containerlab_checksums.txt"
    mode: "0644"

- name: Extract expected SHA256 from checksums file
  ansible.builtin.shell: >
    grep "containerlab_{{ containerlab_version }}_linux_{{ containerlab_arch_map[ansible_facts['architecture']] }}.deb"
    /tmp/containerlab_checksums.txt | awk '{print $1}'
  register: _clab_expected
  changed_when: false

- name: Compute actual SHA256 of downloaded deb
  ansible.builtin.command: sha256sum /tmp/containerlab.deb
  register: _clab_actual
  changed_when: false

- name: Verify SHA256 checksum matches
  ansible.builtin.assert:
    that: _clab_expected.stdout.strip() == _clab_actual.stdout.split()[0]
    fail_msg: "SHA256 mismatch for containerlab {{ containerlab_version }}"

- name: Install containerlab .deb
  ansible.builtin.command: dpkg -i /tmp/containerlab.deb
  register: _clab_install
  changed_when: _clab_install.rc == 0

- name: Clean up download artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/containerlab.deb
    - /tmp/containerlab_checksums.txt

- name: Verify containerlab installation
  ansible.builtin.command: containerlab version
  register: _clab_version
  changed_when: false
  failed_when: false
