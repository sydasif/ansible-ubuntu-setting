---
# Managed installs for CLI Python tooling via pipx.
#
# Install strategy: ansible.builtin.pip with --user places pipx at
# ~/.local/bin/pipx and its Python package at ~/.local/lib/pythonX.Y/site-packages/.
# No apt dependency, no bootstrap step — the community.general.pipx module's
# hard-coded pipx>=1.7.0 requirement is satisfied by the pipx version from PyPI.
#
# User-level tooling installed by the user-owned pipx:
#   ~/.local/bin/uv
#   ~/.local/bin/ruff

# ansible.builtin.pip requires python3-pip on the target. Declared here so
# the dependency is explicit and scoped to this role only — setup_base owns
# python3-venv, not python3-pip.
- name: Install python3-pip prerequisite
  ansible.builtin.apt:
    name: python3-pip
    state: present
  become: true

- name: Install user-owned pipx
  ansible.builtin.pip:
    name: pipx
    extra_args: "--user"
  become: false
  environment: "{{ pipx_environment }}"

- name: Install Python CLI tools
  community.general.pipx:
    name: "{{ item }}"
    state: present
    executable: "{{ pipx_user_bin }}/pipx"
  loop: "{{ pipx_packages }}"
  become: false
  environment: "{{ pipx_environment }}"
