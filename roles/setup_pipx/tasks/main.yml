---
# Managed installs for CLI Python tooling via pipx.
#
# System bootstrap:
#   apt -> /usr/bin/pipx -> ~/.local/bin/pipx (pipx installing itself)
#
# User-level tooling (installed via the user-owned pipx; uv on PATH also
# makes pipx default to its uv backend for later installs):
#   ~/.local/bin/uv
#   ~/.local/bin/ruff
#
# No shell is required. The required PATH is supplied explicitly.

- name: Install pipx prerequisite
  ansible.builtin.apt:
    name: pipx
    state: present
  become: true

# ~/.local/bin/pipx cannot install itself (it does not exist yet), so the
# apt-installed pipx bootstraps the user-owned copy first. Only do this when
# needed: the apt pipx (1.4.x) cannot parse the newer venv metadata that
# newer user-owned pipx versions write (e.g. metadata 0.12), so a re-run
# against an existing bootstrap fails on its idempotency check.
- name: Check whether user-owned pipx is installed
  ansible.builtin.stat:
    path: "{{ pipx_user_bin }}/pipx"
  become: false
  register: pipx_user_installed

- name: Bootstrap user-owned pipx with the system pipx
  community.general.pipx:
    name: pipx
    state: present
    install_deps: true
    executable: "{{ pipx_system_bin }}"
  become: false
  environment: "{{ pipx_environment }}"
  when: not pipx_user_installed.stat.exists

- name: Install Python CLI tools
  community.general.pipx:
    name: "{{ item }}"
    state: present
    executable: "{{ pipx_user_bin }}/pipx"
  loop: "{{ pipx_packages }}"
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify pipx
  ansible.builtin.command:
    cmd: "{{ pipx_user_bin }}/pipx --version"
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify installed CLI tools
  ansible.builtin.command:
    cmd: "{{ pipx_user_bin }}/{{ item }} --version"
  loop: "{{ pipx_packages }}"
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"
