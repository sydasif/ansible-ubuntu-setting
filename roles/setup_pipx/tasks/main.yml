---
# Managed installs for CLI Python tooling via pipx.
#
# System bootstrap:
#   apt -> pipx
#
# User-level tooling:
#   ~/.local/bin/pipx
#   ~/.local/bin/uv
#   ~/.local/bin/ruff
#
# No shell is required. The required PATH is supplied explicitly.

- name: Install pipx prerequisite
  ansible.builtin.apt:
    name: pipx
    state: present
  become: true

- name: Install user-owned pipx with uv backend
  community.general.pipx:
    name: pipx
    state: present
    install_deps: true
    executable: "{{ pipx_user_bin }}/pipx"
  become: false
  environment: "{{ pipx_environment }}"

- name: Install Python CLI tools
  community.general.pipx:
    name: "{{ item }}"
    state: present
    executable: "{{ pipx_user_bin }}/pipx"
  loop: "{{ pipx_packages }}"
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify pipx
  ansible.builtin.command:
    cmd: "{{ pipx_user_bin }}/pipx --version"
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify installed CLI tools
  ansible.builtin.command:
    cmd: "{{ pipx_user_bin }}/{{ item }} --version"
  loop: "{{ pipx_packages }}"
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"
