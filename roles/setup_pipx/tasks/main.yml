---
# Managed installs for CLI Python tooling via pipx.
#
# System bootstrap:
#   apt -> pipx
#
# User-level tooling:
#   ~/.local/bin/pipx
#   ~/.local/bin/uv
#   ~/.local/bin/ruff
#
# No shell is required. The required PATH is supplied explicitly.

- name: Install pipx prerequisite
  ansible.builtin.apt:
    name: pipx
    state: present
    update_cache: true
  become: true

- name: Check user-owned pipx
  ansible.builtin.stat:
    path: "{{ pipx_user_bin }}/pipx"
  register: pipx_user_binary
  become: false

- name: Install user-owned pipx with uv backend
  ansible.builtin.command:
    cmd: pipx install "pipx[uv]"
  changed_when: true
  when: not pipx_user_binary.stat.exists
  become: false
  environment: "{{ pipx_environment }}"

- name: Get installed pipx packages
  ansible.builtin.command:
    cmd: pipx list --short
  register: pipx_list
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"

- name: Install Python CLI tools
  ansible.builtin.command:
    cmd: "pipx install {{ item }}"
  changed_when: true
  loop: "{{ pipx_packages }}"
  when: item not in (pipx_list.stdout_lines | map('split', ' ') | map('first') | list)
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify pipx
  ansible.builtin.command:
    cmd: pipx --version
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"

- name: Verify installed CLI tools
  ansible.builtin.command:
    cmd: "{{ item }} --version"
  loop: "{{ pipx_packages }}"
  changed_when: false
  failed_when: false
  become: false
  environment: "{{ pipx_environment }}"
