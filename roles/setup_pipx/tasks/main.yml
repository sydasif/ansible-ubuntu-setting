---
# Managed installs for CLI Python tooling via pipx.
#
# Install strategy: apt installs python3-pipx (PEP 668 compliant — no pip
# --user). Community.general.pipx uses /usr/bin/pipx directly; app venvs
# still live in ~/.local/share/pipx/ and symlinks in ~/.local/bin/.
#
# User-level tooling installed by pipx:
#   ~/.local/bin/uv
#   ~/.local/bin/ruff
#   ~/.local/bin/yt-dlp

- name: Install python3-pip prerequisite
  ansible.builtin.apt:
    name: python3-pip
    state: present
  become: true

- name: Install pipx via apt (PEP 668 compliant)
  ansible.builtin.apt:
    name: pipx
    state: present
  become: true

- name: Install Python CLI tools
  community.general.pipx:
    name: "{{ item }}"
    state: present
    executable: "{{ pipx_user_bin }}/pipx"
  loop: "{{ pipx_packages }}"
  become: false
  environment: "{{ pipx_environment }}"
