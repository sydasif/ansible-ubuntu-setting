---
- name: Ensure snapd is available
  ansible.builtin.command: snap --version
  register: snap_check
  changed_when: false
  failed_when: false

- name: Install Ghostty via snap (fallback for Ubuntu 26.04)
  ansible.builtin.shell: snap install ghostty --classic
  when: snap_check.rc == 0
  register: ghostty_snap_install
  changed_when: "'installed' in ghostty_snap_install.stdout or ghostty_snap_install.rc == 0"
  failed_when: false

- name: Add Ghostty PPA
  ansible.builtin.apt_repository:
    repo: "ppa:{{ ghostty_ppa }}"
    state: present
  notify: Update apt cache
  when: ansible_facts['lsb']['codename'] != 'resolute'

- name: Install Ghostty via apt
  ansible.builtin.apt:
    name: ghostty
    state: present
    update_cache: yes
  when: ansible_facts['lsb']['codename'] != 'resolute'
