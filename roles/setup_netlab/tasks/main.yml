---
- name: Check if networklab is already installed
  ansible.builtin.command:
    cmd: netlab version
  become: false
  register: networklab_version_check
  changed_when: false
  failed_when: false

- name: Install networklab via pipx
  ansible.builtin.command:
    cmd: "pipx install {{ netlab_pipx_package }}"
  become: false
  when: networklab_version_check.rc != 0
  register: networklab_install_result
  changed_when: networklab_install_result.rc == 0

- name: Inject networklab dependencies
  ansible.builtin.command:
    cmd: "pipx inject {{ netlab_pipx_package }} {{ item }}"
  loop: "{{ netlab_injected_packages }}"
  become: false
  when: networklab_version_check.rc != 0
  changed_when: true

- name: Verify networklab installation
  ansible.builtin.command:
    cmd: netlab version
  become: false
  when: networklab_version_check.rc != 0 and networklab_install_result is succeeded
  changed_when: false
