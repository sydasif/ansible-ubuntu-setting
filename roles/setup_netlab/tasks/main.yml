---
- name: Install networklab via pipx
  community.general.pipx:
    name: "{{ netlab_pipx_package }}"
    state: present
    executable: "{{ netlab_pipx_executable }}"
  become: false
  environment: "{{ netlab_pipx_environment }}"

- name: Get networklab injected packages
  community.general.pipx_info:
    name: "{{ netlab_pipx_package }}"
    include_injected: true
    executable: "{{ netlab_pipx_executable }}"
  become: false
  environment: "{{ netlab_pipx_environment }}"
  register: netlab_pipx_info
  failed_when: false

- name: Collect injected package names
  ansible.builtin.set_fact:
    netlab_injected_present: "{{ ((netlab_pipx_info.application | first | default({})).injected | default({})).keys() | list }}"

- name: Calculate missing injected packages
  vars:
    _netlab_normalized: >-
      {{
        netlab_injected_packages
        | map('regex_replace', '^([^<>=!~]+).*', '\\1')
        | map('replace', '_', '-')
        | map('replace', '.', '-')
        | list
      }}
    _netlab_spec_by_name: "{{ dict(_netlab_normalized | zip(netlab_injected_packages)) }}"
  ansible.builtin.set_fact:
    _netlab_missing_packages: >-
      {{
        _netlab_normalized
        | reject('in', netlab_injected_present)
        | map('extract', _netlab_spec_by_name)
        | list
      }}

- name: Inject networklab pinned dependencies in batch
  community.general.pipx:
    name: "{{ netlab_pipx_package }}"
    state: inject
    inject_packages: "{{ _netlab_missing_packages }}"
    executable: "{{ netlab_pipx_executable }}"
  become: false
  when: _netlab_missing_packages | length > 0
  environment: "{{ netlab_pipx_environment }}"

- name: Verify networklab installation
  ansible.builtin.command:
    cmd: netlab version
  become: false
  changed_when: false
  failed_when: false
  environment: "{{ netlab_pipx_environment }}"
