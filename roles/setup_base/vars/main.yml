---
# Prerequisites for downstream roles: setup_dotfiles clones a git repo, and
# the starship installer in setup_base curls the upstream script.
dependencies:
  - software-properties-common
  - curl
  - git

cli_packages:
  - bat
  - zsh
  - tree
  - lsd
  - fzf
  - gh
  - ffmpeg
  - sshpass
  - ibus-table-cangjie3
  - ibus-table-cangjie5
  - ibus-table-cangjie-big
  - libchewing3

python_packages:
  - python3-venv
