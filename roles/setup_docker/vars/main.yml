---
# vars file for setup_docker
docker_dependencies:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
docker_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_repository_repo: >-
  deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
  https://download.docker.com/linux/ubuntu
  {{ ansible_facts['distribution_release'] | lower }} stable
docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_data_root: "{{ storage_root }}/docker"
docker_daemon_json_path: /etc/docker/daemon.json
docker_systemd_override_dir: /etc/systemd/system/docker.service.d
