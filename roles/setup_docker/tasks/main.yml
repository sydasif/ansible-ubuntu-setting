# Ref: https://github.com/ChristianLempa/boilerplates/blob/main/ansible/docker/inst-docker-ubuntu.yaml
---
- name: Install docker dependencies
  ansible.builtin.apt:
    name: "{{ docker_dependencies }}"
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG key for docker
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: "{{ docker_gpg_key_path }}"
    mode: "0644"

- name: Add repository for docker
  ansible.builtin.apt_repository:
    filename: docker
    repo: "{{ docker_repository_repo }}"
    state: present
  notify: Update apt cache

- name: Install docker engine
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    update_cache: true
  notify: Start and enable docker

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'
  notify: Start and enable docker

# Use 0710 explicitly: docker re-chmods its data-root to 0710 at startup, so a
# different value here (e.g. 0711) made this task report changed on every run.
- name: Create Docker data directory on /storage
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: "0710"

- name: Configure Docker data-root to /storage
  ansible.builtin.copy:
    dest: "{{ docker_daemon_json_path }}"
    content: |
      {
        "data-root": "{{ docker_data_root }}"
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker for data-root change

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
