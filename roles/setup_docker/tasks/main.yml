---
- name: Install docker dependencies
  ansible.builtin.apt:
    name: "{{ docker_dependencies }}"

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG key for docker
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: "{{ docker_gpg_key_path }}"
    mode: "0644"

- name: Add repository for docker
  ansible.builtin.apt_repository:
    filename: docker
    repo: "{{ docker_repository_repo }}"
    state: present
    update_cache: true

- name: Install docker engine
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
  notify: Start and enable docker

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'

# storage_root is shared with setup_vagrant: create it explicitly as 0755
# root:root so it stays traversable for every consumer's data paths, rather
# than leaving its mode/owner to whichever subdirectory task creates it first.
- name: Ensure storage root directory exists
  ansible.builtin.file:
    path: "{{ storage_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Use 0710 explicitly: docker re-chmods its data-root to 0710 at startup, so a
# different value here (e.g. 0711) made this task report changed on every run.
- name: Create Docker data directory under storage_root
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: "0710"

- name: Check if daemon.json exists
  ansible.builtin.stat:
    path: "{{ docker_daemon_json_path }}"
  register: _daemon_json_stat

- name: Read existing daemon.json
  ansible.builtin.slurp:
    src: "{{ docker_daemon_json_path }}"
  register: _daemon_json_raw
  when: _daemon_json_stat.stat.exists

- name: Merge and write daemon.json
  ansible.builtin.copy:
    content: >-
      {{
        (_daemon_json_raw.content | default('e30=') | b64decode | from_json)
        | combine({'data-root': docker_data_root})
        | to_nice_json
      }}
    dest: "{{ docker_daemon_json_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker for data-root change

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
