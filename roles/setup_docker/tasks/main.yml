# Ref: https://github.com/ChristianLempa/boilerplates/blob/main/ansible/docker/inst-docker-ubuntu.yaml
---
- name: Install docker dependencies
  ansible.builtin.apt:
    name: "{{ docker_dependencies }}"
    update_cache: true

- name: Set up Docker APT repository
  ansible.builtin.include_tasks:
    file: ../../common/tasks/apt_keyring.yml
  vars:
    apt_keyring_name: "docker"
    apt_keyring_url: "{{ docker_gpg_key_url }}"
    apt_keyring_repo: "{{ docker_repository_repo }}"
    apt_keyring_key_dest: "/etc/apt/keyrings/docker.asc"
    apt_keyring_gpg_dest: "/etc/apt/keyrings/docker.gpg"
    apt_repository_filename: "docker"

- name: Install docker engine
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    update_cache: true
  register: docker_installation
  notify: Start and enable docker

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user is defined and ansible_user != 'root'
  notify: Start and enable docker

# Use 0710 explicitly: docker re-chmods its data-root to 0710 at startup, so a
# different value here (e.g. 0711) made this task report changed on every run.
- name: Create Docker data directory on /storage
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: "0710"

- name: Configure Docker data-root to /storage
  ansible.builtin.copy:
    dest: "{{ docker_daemon_json_path }}"
    content: |
      {
        "data-root": "{{ docker_data_root }}"
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker for data-root change
